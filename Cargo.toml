[package]
name = "game-opt-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Static binary analysis and reversible patching for single-player games you own"
license = "MIT"
authors = ["wahaznb"]

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# UUID for temporary files
uuid = { version = "1.6", features = ["v4"] }

# File system
dirs = "5.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Binary parsing
goblin = "0.8"
# x86/x86-64 decode + re-encode (REA byte-level candidate generation)
iced-x86 = "1.22"

# MCP server (stdio + HTTP transports)
axum = { version = "0.7", features = ["json"] }

[dev-dependencies]
tempfile = "3.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux perf_event_open sampling (no external perf binary, no root)
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
