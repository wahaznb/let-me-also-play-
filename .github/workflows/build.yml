name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-opt-tool-windows
          path: target/x86_64-pc-windows-msvc/release/game-opt-tool.exe

  build-windows-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: x86_64-pc-windows-gnu
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-opt-tool-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/game-opt-tool.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
      - run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-opt-tool-linux
          path: target/release/game-opt-tool

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: x86_64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-opt-tool-macos
          path: target/x86_64-apple-darwin/release/game-opt-tool

  build-macos-apple-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-opt-tool-macos-arm64
          path: target/aarch64-apple-darwin/release/game-opt-tool

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - run: cargo test --all-targets --target x86_64-pc-windows-msvc

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
      - run: cargo test --all-targets

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay-rust/toolchain@stable
        with:
          target: x86_64-apple-darwin
      - run: cargo test --all-targets --target x86_64-apple-darwin
