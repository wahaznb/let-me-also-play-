# Game configuration
#
# Entries here are metadata only: the binary format, the architecture, and
# quirks worth preserving. Nothing in this file is a verified list of hot
# functions — use `sample` or `rea` to find addresses, and `decompile` to read
# them.
#
# To add your own game, copy the block below and change the key. Game names are
# matched case-insensitively and ignore punctuation, so "Deus Ex" and "DEUS-EX"
# resolve to the same entry.

games:
  deus-ex:
    name: "Deus Ex (2000)"
    version: "1.0"
    engine: "Unreal Engine 1"
    binary_format: PE
    architecture: X86

    # Numeric addresses discovered with `rea` or `decompile`. Function names
    # are not resolved yet.
    hot_functions: []

    # Behaviors that must be preserved by any patch you write by hand.
    quirks: []
    optimization_hints: {}

# Quirks shared by every game, keyed by normalized game name.
quirks:
  games: {}
